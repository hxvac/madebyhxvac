<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Made By Hxvac</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="preload">

<!-- NAV -->
<header class="nav">
  <div class="nav-inner">
    <nav class="nav-left">
      <a href="#services">Services</a>
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
    </nav>

    <div class="brand">MADE BY HXVAC</div>

    <button class="btn-outline" onclick="document.querySelector('#contact').scrollIntoView({behavior:'smooth'})">
      Contact
    </button>
  </div>
</header>

<!-- HERO -->
<section class="hero">

  <!-- HERO GROUP -->
  <div class="hero-group">

    <!-- FLOATS -->
    <img src="assets/float-01.png" class="sticker s1" alt="">
    <img src="assets/float-02.png" class="sticker s2" alt="">
    <img src="assets/float-03.png" class="sticker s3" alt="">
    <img src="assets/float-04.png" class="sticker s4" alt="">

    <!-- CENTER CARD -->
    <div class="center-card">
      <img src="assets/logo-main.png" class="center-logo" alt="Made By Hxvac">
    </div>

    <!-- BUTTONS (INSIDE GROUP, BELOW CARD) -->
    <div class="hero-actions">
      <a href="#services" class="pill-anim"><span>Services</span></a>
      <a href="#shop" class="pill-anim"><span>Shop</span></a>
    </div>

  </div>

</section>

<!-- BELOW HERO -->
<section class="below">
  <div class="bottom-pills">
    <button class="pill2">Work Process</button>
    <button class="pill2 primary">Contact!</button>
    <button class="pill2">Terms of Service</button>
  </div>
</section>

<section id="services" class="section">Services section</section>
<section id="shop" class="section">Shop section</section>
<section id="about" class="section">About section</section>
<section id="contact" class="section">Contact section</section>

<script src="script.js"></script>
</body>
</html>
