<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Made By Hxvac</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="preload">

  <!-- NAV -->
  <header class="nav">
    <div class="nav-inner">
      <nav class="nav-left">
        <a href="#">Services</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
      </nav>

      <div class="brand">KLD</div>

      <div class="nav-right">
        <button class="btn-outline">Contact</button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">

    <!-- FLOATING IMAGES -->
    <img src="assets/float-01.png" class="sticker s1" alt="">
    <img src="assets/float-02.png" class="sticker s2" alt="">
    <img src="assets/float-03.png" class="sticker s3" alt="">
    <img src="assets/float-04.png" class="sticker s4" alt="">

    <!-- CENTER LOGO CARD -->
    <div class="center-card">
      <img src="assets/logo-main.png" class="center-logo" alt="Made By Hxvac">
    </div>

    <!-- HERO BUTTONS -->
    <div class="hero-actions">
      <a href="#" class="pill-anim"><span>Services</span></a>
      <a href="#" class="pill-anim"><span>Shop</span></a>
    </div>

  </section>

  <!-- BELOW HERO -->
  <section class="below">
    <div class="bottom-pills">
      <button class="pill2">Work Process</button>
      <button class="pill2 primary">Contact!</button>
      <button class="pill2">Terms of Service</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
